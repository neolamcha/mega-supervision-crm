version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mega-postgres
    environment:
      POSTGRES_DB: mega_supervision
      POSTGRES_USER: mega_admin
      POSTGRES_PASSWORD: MegaSupervision2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - mega-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mega_admin -d mega_supervision"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mega-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mega-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mega-backend
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: mega_admin
      DB_PASSWORD: MegaSupervision2026
      DB_NAME: mega_supervision
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: mega-supervision-jwt-secret-2026-extremely-secure-key
      JWT_EXPIRATION: 24h
      JWT_REFRESH_EXPIRATION: 7d
      APP_PORT: 3000
      APP_ENV: production
      APP_URL: https://mega-supervision.com
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - mega-network
    restart: unless-stopped
    volumes:
      - backend_uploads:/app/uploads

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: /api/v1
    container_name: mega-web
    environment:
      NEXT_PUBLIC_API_URL: /api/v1
    ports:
      - "80:3000"
    depends_on:
      - backend
    networks:
      - mega-network
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: mega-nginx
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    depends_on:
      - web
      - backend
    networks:
      - mega-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  mega-network:
    driver: bridge
